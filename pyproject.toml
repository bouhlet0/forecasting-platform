[project]
name = "forecasting-platform"
version = "0.1.0"
description = "Hierarchical time series forecasting platform for the M5 competition using LightGBM"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "lightgbm>=4.6.0",
    "matplotlib>=3.10.9",
    "mlflow>=3.12.0",
    "numpy>=2.4.4",
    "polars>=1.40.1",
    "scipy>=1.17.1"
]

[project.optional-dependencies]
dev = [
    "ipykernel",
    "notebook",
]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]